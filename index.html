<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepanshu Enterprises – Hero Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--red:#d71920;--red-d:#a51117;--ink:#1d1d1f;--mute:#6b6b70;--line:#e4e4e8;--bg:#f6f6f8;--card:#fff;--green:#1f8a4c;--amber:#b7791f;--blue:#2457c5}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}header small{opacity:.85}
nav{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:52px;z-index:4}
nav button{flex:none;border:0;background:none;padding:12px;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .n{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap}
.stat .l{color:var(--mute);font-size:13px}.stat .s{color:var(--mute);font-size:12px;margin-top:2px}
.click{cursor:pointer}.click:hover{border-color:var(--red)}
h2{font-size:17px;margin:20px 0 10px}h3{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid #cfcfd6;border-radius:8px;background:#fff;width:100%}
.row input,.row select{width:auto;max-width:260px}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.btn{border:0;background:var(--red);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--red-d)}.btn.g{background:#fff;color:var(--ink);border:1px solid #cfcfd6}.btn.s{padding:5px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid #cfcfd6;border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;padding:8px 12px;font:inherit;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#fafafb;font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:#e5f5ec;color:var(--green)}.p-w{background:#fdf3e2;color:var(--amber)}.p-r{background:#fde8e8;color:var(--red)}.p-n{background:#eee;color:#555}.p-b{background:#e6eefc;color:var(--blue)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}.empty{padding:22px;text-align:center;color:var(--mute)}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar .t{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;background:#f0f0f3;border-radius:4px;height:14px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--red)}
.bar .v{width:105px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:flex;gap:4px;align-items:flex-end;height:150px;margin-top:8px}
.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols i{display:block;width:70%;max-width:34px;background:var(--red);border-radius:3px 3px 0 0;min-height:1px}
.cols b{font-size:11px;font-weight:600;margin-bottom:2px}.cols span{font-size:11px;color:var(--mute);margin-top:4px}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:96%}
dialog .hd{background:var(--red);color:#fff;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
dialog .bd{padding:16px;max-height:80vh;overflow:auto}
.drop{border:2px dashed #cfcfd6;border-radius:12px;padding:26px;text-align:center;background:#fff;cursor:pointer}
.drop.over{border-color:var(--red);background:#fff5f5}
.note{background:#fff8e6;border:1px solid #f1d9a0;border-radius:10px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<header>
  <div><h1>Deepanshu Enterprises</h1><small>Hero Business Dashboard · DMS data</small></div>
  <div style="text-align:right"><span id="sync" style="font-size:12px;opacity:.9;margin-right:6px"></span><button class="btn g s hide-off" onclick="backup()">⬇ Backup</button> <button class="btn g s" onclick="$('restoreFile').click()">⬆ Restore</button><input type="file" id="restoreFile" accept=".json" hidden onchange="restore(this)"> <button class="btn g s" id="logoutBtn" style="display:none" onclick="logout()">Logout</button></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<dialog id="dlg"><div class="hd"><span id="dlgT"></span><span style="cursor:pointer" onclick="dlg.close()">✕</span></div><div class="bd" id="dlgB"></div></dialog>

<script>
/* ================= data ================= */
const KEY="deepanshuHeroDMS_v2";
const EMPTY=()=>({vs:{},vp:{},sv:{},pp:{},ps:{},rc:{},stock:[],acct:{},exp:[],coll:{},fin:[],finpay:[],snap:{},wc:{},areg:[],dupok:{},meta:{},chal:{},old:[],dbk:[],emp:[],att:{},wsd:{}});
let D=EMPTY();
try{const s=localStorage.getItem(KEY);if(s)D=Object.assign(EMPTY(),JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert("Browser storage is full or blocked. Take a Backup file.")}}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const NN=v=>{const t=String(v??"").trim();return /-$/.test(t)?-N(t.slice(0,-1)):N(t)};
const N=v=>{if(typeof v==="number")return v;const x=parseFloat(String(v??"").replace(/[₹,\s]/g,""));return isNaN(x)?0:x};
const rs=n=>(n<0?"-":"")+"₹"+Math.round(Math.abs(Number(n)||0)).toLocaleString("en-IN");
const lakh=n=>Math.abs(n)>=1e5?(n<0?"-":"")+"₹"+(Math.abs(n)/1e5).toFixed(2)+" L":rs(n);
const fd=d=>d?new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}):"";
const diff=d=>Math.round((new Date(today()+"T00:00")-new Date(d+"T00:00"))/864e5);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jsq=s=>esc(String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/[\r\n]/g," "));
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const V=o=>Object.values(o);
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function pDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+432e5));
  if(typeof v==="number"&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v||"").trim();let m;
  if(m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[a-z]*[\s\-,]*(\d{2,4})/)){const mo=MON[m[2].toLowerCase()];if(mo!=null){const y=m[3].length===2?"20"+m[3]:m[3];return`${y}-${String(mo+1).padStart(2,"0")}-${m[1].padStart(2,"0")}`}}
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){const y=m[3].length===2?"20"+m[3]:m[3];return`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return "";
}
// "RAGHAV MACHAL66115-01-SCON-0426-1" -> "RAGHAV MACHAL"
function cname(n,code){n=String(n||"").trim();code=String(code||"").trim();if(code&&n.endsWith(code))n=n.slice(0,-code.length);n=n.replace(/\d{5}-\d{2}-[A-Z]+-[\d-]+$/,"").replace(/\d-\d{6,}$/,"");return n.replace(/[\s.]+$/,"").trim()||"Cash Sales"}

/* ================= DMS report detection + aggregation ================= */
const REPORTS={
  vs:{name:"Vehicle Sales Transactions",test:h=>h.has("Vin No.")&&h.has("Bill Amount")},
  vp:{name:"Tally – Vehicle Purchase",test:h=>h.has("Vin No")&&h.has("Stock In Date")},
  sv:{name:"Tally – Service Transaction",test:h=>h.has("Job Card Type")},
  pp:{name:"Tally – Part Purchase",test:h=>h.has("GRN No")||h.has("Part Purchase Order#")},
  ps:{name:"Part Sales Transactions",test:h=>h.has("Total Invoice Amount")&&h.has("Part NO")},
  stock:{name:"Parts Stock Report",test:h=>h.has("Opening Qty")&&h.has("Part No")},
  rc:{name:"Tally – Payment (receipts)",test:h=>h.has("Transaction Type")&&h.has("Voucher Number")&&h.has("Amount")},
  acct:{name:"Tally – Account Master",test:h=>h.has("Group / Category")},
  snap:{name:"Daily Snapshot (Parts / Vehicle / Service)",test:()=>false},
  wc:{name:"Dealer Claim Report (warranty)",test:h=>h.has("DMS CLAIM NO.")&&h.has("CLAIM STATUS DESCRIPTION")}
};
function detect(rows){const h=new Set(Object.keys(rows[0]||{}));return Object.keys(REPORTS).find(k=>REPORTS[k].test(h))}
function aggregate(type,rows){
  const out={};const g=(r,k)=>r[k]??"";
  if(type==="vs")rows.forEach(r=>{const no=g(r,"Invoice No"),vin=String(g(r,"Vin No.")).trim();if(!no||!vin)return;const k=no+"|"+vin;const o=out[k]||(out[k]={no,vin,date:pDate(g(r,"Invoice Date")),cust:cname(g(r,"Customer Name"),g(r,"Customer Code")),code:String(g(r,"Customer Code")).trim(),model:String(g(r,"Model")).trim(),variant:g(r,"Variant"),cat:g(r,"Product Category"),value:N(g(r,"Value")),bill:N(g(r,"Bill Amount")),disc:N(g(r,"Line Item Discount"))+N(g(r,"Header Discount")),open:true});if(String(g(r,"Invoice Status")).trim()==="Cancelled")o.open=false});
  if(type==="vp")rows.forEach(r=>{const vin=String(g(r,"Vin No")).trim();if(!vin)return;out[vin+"|"+g(r,"Invoice Number")]={vin,date:pDate(g(r,"Stock In Date"))||pDate(g(r,"Invoice Date")),inv:g(r,"Invoice Number"),model:String(g(r,"Model")).trim(),desc:g(r,"SKU Description"),sup:cname(g(r,"Supplier Name"),g(r,"Supplier Code")),taxable:N(g(r,"Assessable Value")),cost:N(g(r,"Assessable Value"))+N(g(r,"CGST Amt"))+N(g(r,"SGST/UTGST Amt"))+N(g(r,"IGST Amt"))+N(g(r,"TCS Amt"))+N(g(r,"Cess Amt"))}});
  if(type==="sv")rows.forEach(r=>{const no=g(r,"Invoice Number");if(!no)return;const o=out[no]||(out[no]={no,date:pDate(g(r,"Invoice Date")),jc:g(r,"Narration"),jt:String(g(r,"Job Card Type")).trim(),it:String(g(r,"Invoice Type")).trim(),cust:cname(g(r,"Customer Name"),g(r,"Customer Code")),labour:0,parts:0,lines:0,total:N(g(r,"Round Off Amount")),open:true,model:""});if(String(g(r,"Invoice Status")).trim()==="Cancelled"){o.open=false;return}
    const amt=N(g(r,"Retail Amount"));if(String(g(r,"JOB/PART")).trim()==="Job"){o.labour+=amt;const m=String(g(r,"SKU Name")).split("-").pop().trim();if(!o.model&&m&&m.length<25)o.model=m}else o.parts+=amt;o.lines+=amt});
  if(type==="sv")V(out).forEach(o=>{if(!o.total||Math.abs(o.total-o.lines)>Math.max(5,o.lines*.05))o.total=Math.round(o.lines);delete o.lines});
  if(type==="pp")rows.forEach(r=>{const no=g(r,"Invoice Number");if(!no)return;const o=out[no]||(out[no]={no,date:pDate(g(r,"GRN Date"))||pDate(g(r,"Invoice Date")),sup:cname(g(r,"Supplier Name"),g(r,"Supplier Code")),total:N(g(r,"Invoice Value")),lines:0,cats:{}});const c=g(r,"Product Category")||"Other";o.cats[c]=(o.cats[c]||0)+N(g(r,"Net Taxable Value"));o.lines++});
  if(type==="ps")rows.forEach(r=>{const no=g(r,"Invoice Number");if(!no)return;const o=out[no]||(out[no]={no,date:pDate(g(r,"Invoice Date")),cust:cname(g(r,"Customer Name"),g(r,"Customer Code")),total:N(g(r,"Total Invoice Amount")),it:g(r,"Invoice Type"),open:true,cats:{}});if(String(g(r,"Invoice Status")).trim()==="Cancelled")o.open=false;const c=g(r,"Product Category")||"Other";o.cats[c]=(o.cats[c]||0)+N(g(r,"Assessable Value"))});
  if(type==="rc")rows.forEach(r=>{const no=g(r,"Voucher Number");if(!no)return;out[no]={no,date:pDate(g(r,"Voucher Date")),tt:String(g(r,"Transaction Type")).trim(),mode:g(r,"Mode of Payment"),code:String(g(r,"Customer Code")).trim(),party:cname(g(r,"Ledger Code"),g(r,"Customer Code")),amt:N(g(r,"Amount")),bank:g(r,"Bank Name")}});
  if(type==="wc")rows.forEach(r=>{const no=String(g(r,"DMS CLAIM NO.")).trim();if(!no)return;const part=String(g(r,"PART CODE")).trim(),code=String(g(r,"CLAIM STATUS CODE")).trim(),d=String(g(r,"CLAIM STATUS DESCRIPTION")).trim();
    out[no+"|"+part]={no,part,desc:String(g(r,"PART DES")).trim(),frame:String(g(r,"FRAME NO")).trim(),date:pDate(g(r,"REFERENCE DATE")),bill:pDate(g(r,"PART BILLING DATE")),ref:g(r,"REFRENCE NO"),code,st:d,
      cls:/^H/.test(code)||/^HOLD/i.test(d)?"H":/^R/.test(code)||/^REJ/i.test(d)?"R":"A",amt:NN(g(r,"TOTAL PART AMT"))+NN(g(r,"TOTAL SERVICE AMT")),partAmt:NN(g(r,"PART AMOUNT")),labour:NN(g(r,"LABOUR AMOUNT")),handling:NN(g(r,"HANDLING CHARGE")),remark:String(g(r,"WTY REMARK")).trim()}});
  if(type==="acct")rows.forEach(r=>{const code=String(g(r,"Customer Code")).trim();if(!code)return;out[code]={code,name:cname(g(r,"Customer Name"),code),type:g(r,"Type"),group:g(r,"Group / Category"),mobile:String(g(r,"Mobile No.")).trim(),city:g(r,"Village/Town/City")}});
  if(type==="stock")return rows.filter(r=>g(r,"Part No")).map(r=>({part:g(r,"Part No"),name:String(g(r,"Part Name")).replace(/-[A-Z0-9]+$/,""),cat:g(r,"Product Category"),qty:N(g(r,"Opening Qty")),val:N(g(r,"Opening Value"))}));
  return out;
}
async function readWorkbook(file){
  const buf=await file.arrayBuffer();const b=new Uint8Array(buf.slice(0,8));
  if(!(b[0]===0x50&&b[1]===0x4B)&&!(b[0]===0xD0&&b[1]===0xCF)){const txt=new TextDecoder().decode(buf);const ln=txt.split(/\r?\n/);
    if(ln[0]&&ln[0].split("\t").length>5){const H=ln[0].split("\t").map(x=>x.trim());return ln.slice(1).map(l=>{const c=l.split("\t"),o={};H.forEach((h,i)=>{if(h)o[h]=(c[i]??"").trim()});return o}).filter(o=>Object.values(o).some(v=>v!==""))}}const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}).map(r=>{const o={};for(const k in r)o[k.trim()]=r[k];return o}).filter(r=>Object.values(r).some(v=>String(v).trim()!==""));
}

/* ================= derived ================= */
let per="fy";
function range(){const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(per==="m")return[iso(new Date(y,m,1)),today()];if(per==="lm")return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
  if(per==="fy"){const fy=m>=3?y:y-1;return[`${fy}-04-01`,`${fy+1}-03-31`]}if(per==="t")return[today(),today()];return["0000","9999"]}
const inR=(d,r)=>d&&d>=r[0]&&d<=r[1];
const perSel=()=>`<select onchange="per=this.value;render()">${[["t","Today"],["m","This month"],["lm","Last month"],["fy","This financial year"],["all","All data"]].map(([v,l])=>`<option value="${v}" ${v===per?"selected":""}>${l}</option>`).join("")}</select>`;
const soldVins=()=>new Set(V(D.vs).filter(s=>s.open).map(s=>s.vin));
function sales(r){return V(D.vs).filter(s=>s.open&&(!r||inR(s.date,r)))}
function services(r){return V(D.sv).filter(s=>s.open&&(!r||inR(s.date,r)))}
let _vpI=null,_vpK=null;function vpOf(vin){if(_vpK!==D.vp){_vpI={};V(D.vp).forEach(p=>{const o=_vpI[p.vin];if(!o||p.date>o.date)_vpI[p.vin]=p});_vpK=D.vp}return _vpI[vin]}
function margin(s){const p=vpOf(s.vin);return p?s.value-p.taxable:null}
function firstSale(){const d=V(D.vs).map(s=>s.date).filter(Boolean).sort();return d[0]||""}
function stockVehicles(){const sold=soldVins(),fs=firstSale();vpOf("");return Object.values(_vpI).filter(p=>!sold.has(p.vin)).map(p=>({...p,age:diff(p.date),old:fs&&p.date<fs}))}
function creditBills(){return services().filter(s=>s.it==="Credit").map(s=>({...s,got:D.coll[s.no]})).sort((a,b)=>a.date.localeCompare(b.date))}
const pending=()=>creditBills().filter(b=>!b.got);
const months=n=>{const a=[],t=new Date();for(let i=n-1;i>=0;i--)a.push(iso(new Date(t.getFullYear(),t.getMonth()-i,1)).slice(0,7));return a};
const ml=m=>new Date(m+"-01T00:00").toLocaleDateString("en-IN",{month:"short"});
function bars(items,fmt=lakh,color){const mx=Math.max(1,...items.map(x=>x[1]));return items.map(([k,v])=>`<div class="bar"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:${v/mx*100}%;${color?"background:"+color:""}"></i></span><span class="v">${fmt(v)}</span></div>`).join("")}
function cols(items,fmt){const mx=Math.max(1,...items.map(x=>x[1]));return `<div class="cols">${items.map(([k,v])=>`<div><b>${fmt(v)}</b><i style="height:${v/mx*110}px"></i><span>${k}</span></div>`).join("")}</div>`}
function groupSum(a,kf,vf){const o={};a.forEach(x=>{const k=kf(x)||"Other";o[k]=(o[k]||0)+vf(x)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}

/* ================= views ================= */
const TABS={dash:"Dashboard",daily:"Daily",fin:"Finance",veh:"Vehicles",svc:"Service",acc:"Accidental / Insurance",wcl:"Warranty claims",col:"To collect",parts:"Parts",money:"Money & Expenses",dbk:"📷 Day Book",ws:"🔧 Workshop",att:"🕘 Attendance",oldb:"Old bikes",imp:"Import DMS files"};
let tab="dash";
function nav(){const dn=dupScan().length;$("nav").innerHTML=Object.entries(dn?{...TABS,dup:"⚠ Duplicates"}:TABS).map(([k,v])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${v}${k==="dup"?` <span class="pill p-r">${dn}</span>`:""}${k==="col"&&pending().length?` <span class="pill p-r">${pending().length}</span>`:""}</button>`).join("")}
function go(t){tab=t;nav();render();scrollTo(0,0)}
function render(){if(tab==="dup"&&!dupScan().length)tab="dash";({dup,wcl,dash,daily,fin,veh,svc,acc,col,parts,money,dbk,ws:wsk,att,oldb,imp})[tab]()}
const noData=()=>!Object.keys(D.vs).length&&!Object.keys(D.sv).length&&!Object.keys(D.vp).length;

function dash(){
  if(noData()){$("app").innerHTML=`<div class="card" style="text-align:center;padding:40px"><h2 style="margin-top:0">DMS Excel files</h2><p class="muted">Vehicle Sales, Vehicle Purchase, Service, Part Purchase, Part Sales, Parts Stock, Payment — choose them all together.</p><button class="btn" onclick="go('imp')">Import DMS files</button> <button class="btn g" onclick="go('imp');setTimeout(cloudCheck,50)">☁ Cloud check</button></div>`;return}
  const r=range(),S=sales(r),J=services(r),P=V(D.ps).filter(x=>x.open&&inR(x.date,r));
  const VP=V(D.vp).filter(p=>inR(p.date,r)),PP=V(D.pp).filter(p=>inR(p.date,r));
  const RC=V(D.rc).filter(x=>inR(x.date,r)),EX=D.exp.filter(x=>inR(x.date,r));
  const vsale=sum(S,s=>s.bill),svc=sum(J,j=>j.total),cnt=sum(P,p=>p.total);
  const withM=S.filter(s=>margin(s)!==null),mg=sum(withM,margin);

/* ---------- double-entry detection ---------- */
const nz=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function dupOK(list){if(!list.length)return true;return confirm("⚠ DOUBLE ENTRY?\n\nA similar entry already exists:\n• "+list.slice(0,5).join("\n• ")+(list.length>5?`\n… +${list.length-5} more`:"")+"\n\nSave anyway?  (OK = Yes, Cancel = No)")}
function aregOfDms(no){return D.areg.find(r=>{const d=r.inv?svByV(r.inv,r.invDate):null;return d&&d.no===no})}
function aregDups(v,id){const dv=v.inv?svByV(v.inv,v.invDate):null;return D.areg.filter(r=>{if(r.id===id)return false;const dr=r.inv?svByV(r.inv,r.invDate):null;
  if(dv&&dr&&dv.no===dr.no)return true;if(!dv&&v.inv&&nz(r.inv)===nz(v.inv)&&Math.abs(new Date(r.invDate||r.date)-new Date(v.invDate||v.date))<40*864e5)return true;
  if(nz(v.job)&&nz(r.job)===nz(v.job)&&(nz(v.reg)&&nz(r.reg)===nz(v.reg)||nz(r.cust)===nz(v.cust)))return true;return false})}
function grp(list,kf){const m={};list.forEach(x=>{const k=kf(x);if(k)(m[k]=m[k]||[]).push(x)});return Object.entries(m).filter(([,a])=>a.length>1)}
let _dsK=null,_dsV=null;
function dupScan(all){
  const G=[],add=(type,k,title,items,sev)=>{const key=type+":"+k;if(all||!D.dupok[key])G.push({key,type,title,items,sev,ok:!!D.dupok[key]})};
  grp(sales(),s=>s.vin).forEach(([k,a])=>add("vs",k,`Vehicle sold twice – VIN ${k}`,a.map(s=>({t:`${fd(s.date)} · ${s.no} · ${s.cust} · ${rs(s.bill)}`})),"high"));
  grp(V(D.vp),p=>p.vin).forEach(([k,a])=>add("vp",k,`Vehicle purchased twice – VIN ${k} (${a[0].model})`,a.map(p=>({t:`${fd(p.date)} · invoice ${p.inv} · ${rs(p.cost)}`})),"high"));
  grp(services(),j=>j.jc?nz(j.jc):"").forEach(([k,a])=>add("jc",k,`Same job card billed twice – ${a[0].jc}`,a.map(j=>({t:`${fd(j.date)} · ${j.no} · ${j.jt} · ${rs(j.total)}`})),"check"));
  const ar=D.areg.map(r=>({r,d:r.inv?svByV(r.inv,r.invDate):null}));
  grp(ar,x=>x.d?x.d.no:"").forEach(([k,a])=>add("areg-inv",k,`Accident register: same bill ${k} entered ${a.length} times`,a.map(x=>({t:`${x.r.cust} · ${x.r.reg||""} · job ${x.r.job||"-"} · ${rs(x.r.amt)}`,id:x.r.id,c:"areg"})),"high"));
  grp(D.areg,r=>nz(r.job)&&nz(r.reg)?nz(r.job)+"|"+nz(r.reg):"").forEach(([k,a])=>add("areg-job",k,`Accident register: same vehicle & job no. (${a[0].reg} · job ${a[0].job})`,a.map(r=>({t:`${r.cust} · ${r.inv||"no invoice"} · ${fd(r.invDate||r.date)} · ${rs(r.amt)}`,id:r.id,c:"areg"})),"high"));
  grp(D.fin,f=>f.inv||"").forEach(([k,a])=>add("fin-inv",k,`Finance: same sale ${k} entered ${a.length} times`,a.map(f=>({t:`${f.cust} · ${f.co} · ${rs(f.amt)}`,id:f.id,c:"fin"})),"high"));
  grp(D.fin,f=>nz(f.cust)+"|"+nz(f.co)+"|"+Math.round(N(f.amt))).forEach(([k,a])=>add("fin-same",k,`Finance: same customer, company & amount – ${a[0].cust}`,a.map(f=>({t:`${fd(f.date)} · ${f.co} · ${rs(f.amt)} · ${f.inv||""}`,id:f.id,c:"fin"})),"high"));
  grp(D.finpay,x=>nz(x.co)+"|"+x.date+"|"+Math.round(N(x.amt))).forEach(([k,a])=>add("finpay",k,`Finance money entered twice – ${a[0].co} ${rs(a[0].amt)} on ${fd(a[0].date)}`,a.map(x=>({t:`${x.kind} · ${x.note||""}`,id:x.id,c:"finpay"})),"high"));
  grp(D.exp,e=>e.type+"|"+e.date+"|"+Math.round(N(e.amt))+"|"+nz(e.head)).forEach(([k,a])=>add("exp",k,`Money entry twice – ${a[0].head} ${rs(a[0].amt)} on ${fd(a[0].date)}`,a.map(e=>({t:`${e.mode||""} · ${e.note||""}`,id:e.id,c:"exp"})),"high"));
  grp(D.dbk,x=>(x.kind||x.type)+"|"+x.date+"|"+Math.round(N(x.amt))+"|"+(x.folio||nz(x.name))).forEach(([k,a])=>add("dbk",k,`Day Book entry twice – ${a[0].folio?"Challan "+a[0].folio+" · ":""}${a[0].name} ${rs(a[0].amt)} on ${fd(a[0].date)}`,a.map(x=>({t:`${x.kind==="expense"||x.type==="out"?"Out":"In"} · ${x.ref||""}`,id:x.id,c:"dbk"})),"high"));
  return G}
function sig(){return D.areg.length+"|"+D.fin.length+"|"+D.finpay.length+"|"+D.exp.length+"|"+Object.keys(D.dupok).length}
function dupDel(c,id){if(!confirm("Delete this entry?"))return;D[c]=D[c].filter(x=>x.id!==id);save();cDel(c,id);nav();render()}
function dupIgnore(key){D.dupok[key]=1;save();cPut("dupok",key,{key});nav();render()}

}

/* ---------- daily snapshot (Oracle BI Publisher "XLS" = HTML in MIME) ---------- */
function qp(t){return t.replace(/=\r?\n/g,"").replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)))}
async function readSnapshot(file){
  const raw=await file.text();const head=raw.slice(0,4000);
  if(!/MIME-Version|BI Publisher|<html/i.test(head)||/^PK/.test(raw))return null;
  let html=raw;const i=raw.search(/<html/i);
  if(/Content-Transfer-Encoding:\s*quoted-printable/i.test(head))html=qp(raw);
  else if(/Content-Transfer-Encoding:\s*base64/i.test(head)){const m=raw.split(/\r?\n\r?\n/);try{html=decodeURIComponent(escape(atob(m.slice(2).join("").replace(/[^A-Za-z0-9+/=]/g,""))))}catch(e){}}
  const j=html.search(/<html/i);if(j<0&&i<0)return null;html=html.slice(Math.max(0,j));
  const doc=new DOMParser().parseFromString(html,"text/html");
  const cells=[...doc.querySelectorAll("td,th,div,span,p")].map(e=>e.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
  const title=cells.find(c=>/snapshot/i.test(c)&&c.length<60)||"Snapshot";
  const kind=(title.replace(/GST|Snapshot|Report/gi,"").trim()||"General").replace(/\b\w/g,c=>c.toUpperCase());
  const dealer=cells.slice(0,40).find(c=>c.length<60&&/^[A-Z][A-Z0-9 .&'-]{3,}$/.test(c)&&!/SNAPSHOT|REPORT|^CASH$|^CREDIT$|INVOICE|RETAIL/.test(c))||"";
  const rows=[];

    ${table(["Date","Invoice","Challan","Customer","Model","VIN","Sale (with GST)","Discount","Purchase cost","Margin ex-GST","Finance"],S.slice(0,400).map(s=>{const p=vpOf(s.vin),m=margin(s),fl=finOf(s.no);const cx=chalOf(s.no);return[fd(s.date),esc(s.no),cx?`<b>${esc(cx.ch)}</b>${cx.pend?`<div class="neg">Due ${rs(cx.pend)}</div>`:""}${cx.rcpt&&cx.rcpt.length?`<div class="muted">Day Book ${rs(sum(cx.rcpt,p=>p.amt))}</div>`:""}`:"",esc(s.cust),esc(s.model),`<span class="muted">${esc(s.vin)}</span>`,{n:rs(s.bill)},{n:s.disc?rs(s.disc):""},{n:p?rs(p.cost):"–"},{n:m===null?"–":`<span class="${m<1000?"neg":"pos"}">${rs(m)}</span>`},fl?`<span class="pill ${fl.status==="done"?"p-ok":"p-w"}" style="cursor:pointer" onclick="finForm('${fl.id}')">${esc(fl.co)} ${fl.status==="done"?"✓":"pending"}</span>`:`<button class="btn g s" onclick="finForm(null,'${jsq(s.no)}')">+ Finance</button>`]}),S.length)}`;
  }else{
    const all=stockVehicles().filter(p=>(p.model+p.vin+p.desc).toLowerCase().includes(vq.toLowerCase())).sort((a,b)=>b.age-a.age);
    const st=all.filter(x=>!x.old),old=all.filter(x=>x.old);
    $("app").innerHTML=head+`<div class="grid"><div class="card stat"><div class="l">In stock</div><div class="n">${st.length}</div></div><div class="card stat"><div class="l">Stock value</div><div class="n">${lakh(sum(st,x=>x.cost))}</div></div><div class="card stat"><div class="l">Older than 60 days</div><div class="n neg">${st.filter(x=>x.age>60).length}</div><div class="s">${lakh(sum(st.filter(x=>x.age>60),x=>x.cost))} money stuck</div></div></div>

  }
}
function table(h,rows,total){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>typeof c==="object"&&c!==null?`<td class="num">${c.n}</td>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>${total>rows.length?`<p class="muted">Showing ${rows.length} of ${total}. Use search to narrow.</p>`:""}`:`<div class="card empty">Nothing to show.</div>`}
function refocus(el){const p=el.placeholder;setTimeout(()=>{const n=[...document.querySelectorAll("input")].find(i=>i.placeholder===p);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},0)}

  const M=[[/bajaj ?fin|\bbfl\b/i,"Bajaj Finance"],[/shri ?ram|sriram|\bsfl\b/i,"Shriram Finance"],[/muthoot|mcsl/i,"Muthoot Capital (MCSL)"],[/chola/i,"Chola Finance"],[/idfc/i,"IDFC First Bank"],[/\bhdb\b/i,"HDB Financial"],[/hero ?fin|hfcl/i,"Hero FinCorp"],[/l ?& ?t fin|\blnt\b/i,"L&T Finance"],[/au small/i,"AU Small Finance"]];
  for(const[r,c]of M)if(r.test(t))return coList().find(x=>nz(x)===nz(c))||c;return""}
function dbHead(t,type){const s=String(t||"");if(type==="out"){for(const[r,h]of DB_HEADS)if(r.test(s))return h;return"Other expense"}
  return /ins\.? ?renew|renewal/i.test(s)?"Insurance renewal":dbCo(s)?"Finance company payment":INS_RE.test(s)?"Insurance claim":/commission|incentive/i.test(s)?"Commission / incentive":"Other income"}
const DB_INC={renewal:"Insurance renewal",numberplate:"Number plate"};
function dbIncDetect(t){t=String(t||"");return/plate|hsrp|\bnp\b|नंबर|नम्बर|प्लेट/i.test(t)?"numberplate":/renew|\brent\b|renual|ins\.?\s*re|बीमा|इंश्यो/i.test(t)?"renewal":""}
function dbHeadR(r){if(r.kind==="income"||r.type==="in"){if(DB_INC[r.incType])return DB_INC[r.incType];const d=dbIncDetect(r.name+" "+r.det);if(DB_INC[d])return DB_INC[d]}return dbHead(r.name+" "+r.det,r.kind==="expense"||r.type==="out"?"out":"in")}
function dbDate(v,pg){const s=String(v||pg||"").trim();let m;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/)){const t=new Date();let y=t.getFullYear();const d=`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return diff(d)<-7?`${y-1}${d.slice(4)}`:d}
  return pDate(s)||pDate(pg)||""}
const fyOf=d=>{if(!d)return"";const y=+d.slice(0,4),m=+d.slice(5,7),s=m>=4?y:y-1;return s+"-"+String((s+1)%100).padStart(2,"0")};
const dbEq=(a,b)=>Math.abs(N(a)-N(b))<1,dbDd=(a,b)=>a&&b?Math.abs((new Date(a)-new Date(b))/864e5):99;
function chalByFolio(f,fy){f=String(f||"").trim();if(!f)return null;const L=V(D.chal).filter(c=>String(c.ch||"").trim()===f);return L.find(c=>c.fy===fy)||null}

/* other income / expense lines: link to finance khata, finance file, accident job, credit bill, or a new Money & Expenses entry */
function dbCands(r){const C=[],eq=dbEq,near=(d,k)=>dbDd(r.date,d)<=k,txt=r.name+" "+r.det,ns=x=>nameSim(x,r.name)>=.6;
  const dup=(sc,t)=>C.push({k:"dup",sc,t});

  D.dbk.forEach(x=>{if((x.type||(x.kind==="expense"?"out":x.kind==="income"?"in":""))===r.type&&eq(x.amt,r.amt)&&near(x.date,1))dup(ns(x.name)||!r.name?1:.25,`Day Book already added: ${fd(x.date)} · ${x.name} · ${rs(x.amt)}`)});
  D.exp.filter(e=>e.type===r.type&&e.src!=="dbk"&&eq(e.amt,r.amt)&&near(e.date,2)).forEach(e=>dup(nameSim(e.note||"",r.name)>=.55||nz(e.head)===nz(dbHeadR(r))?.9:.25,`Money & Expenses already has: ${fd(e.date)} · ${e.head} · ${e.note||""}`));
  if(r.type==="in"){
    V(D.rc).filter(x=>!/payment/i.test(x.tt)&&eq(x.amt,r.amt)&&near(x.date,2)).forEach(x=>dup(ns(x.party)?.95:.25,`DMS receipt already has: ${fd(x.date)} · ${x.party} · ${x.no}`));
    Object.entries(D.coll).filter(([,c])=>eq(c.amt,r.amt)&&near(c.date,3)).forEach(([no,c])=>dup(ns(D.sv[no]?.cust||"")?.95:.25,`Credit bill already received: ${no} · ${D.sv[no]?.cust||""}`));
    D.finpay.filter(p=>eq(p.amt,r.amt)&&near(p.date,3)).forEach(p=>dup(nz(p.co)===nz(dbCo(txt))?.95:.25,`Finance khata already has: ${fd(p.date)} · ${p.co} · ${p.kind}`));
    D.fin.filter(f=>f.status==="done"&&f.via==="direct"&&eq(f.recd||f.amt,r.amt)&&near(f.doneDate,3)).forEach(f=>dup(ns(f.cust)?.95:.25,`Finance file already "Received": ${f.cust} · ${f.co}`));
    D.areg.filter(a=>N(a.insRecd)&&eq(a.insRecd,r.amt)&&near(a.insDate,5)).forEach(a=>dup(ns(a.cust)?.9:.25,`Accident job already has received: ${a.cust} · ${a.inv||""}`));
    const co=dbCo(txt);if(co)C.push({k:"finpay",sc:.8,co,t:`Finance company payment → ${co}  khata`});
    D.fin.filter(f=>f.status!=="done"&&eq(f.amt,r.amt)).forEach(f=>C.push({k:"fin",sc:ns(f.cust)?.9:co&&nz(co)===nz(f.co)?.75:.5,id:f.id,t:`Finance file: ${f.cust} · ${f.co} · ${rs(f.amt)} → "Received"`}));
    accRows().filter(a=>a.src==="reg"&&a.pend>1&&(eq(a.pend,r.amt)||eq(a.due,r.amt)||ns(a.cust)&&N(r.amt)<=a.due+1)).forEach(a=>C.push({k:"areg",sc:(ns(a.cust)?.55:.4)+(eq(a.due,r.amt)?.3:0)+(INS_RE.test(txt)&&nz(insNorm(txt))===nz(a.insW)?.1:0),id:a.id,t:`Accident job: ${a.cust}${a.inv?" · "+a.inv:""} · company due ${rs(a.due)}`}));
    pending().filter(b=>!aregOfDms(b.no)&&(eq(b.total,r.amt)||nameSim(b.cust,r.name)>=.75&&N(r.amt)<=b.total+1)).forEach(b=>C.push({k:"coll",sc:(nameSim(b.cust,r.name)>=.6?.55:.4)+(eq(b.total,r.amt)?.35:0),no:b.no,t:`Credit bill: ${b.no} · ${b.cust} · ${rs(b.total)} → received`}));
  }
  C.push({k:"exp",sc:.3,t:`new entry → Money & Expenses (${dbHeadR(r)})`},{k:"skip",sc:0,t:"Skip"});
  C.forEach(c=>c.key=c.key||c.k+"|"+(c.id||c.no||c.co||c.t));
  return C.sort((a,b)=>b.sc-a.sc)}
const dbCur=r=>r.c.find(c=>c.key===r.pk)||r.c[0];

/* vehicle sale lines: folio = Challan no. → DMS sale; finance file; old bike; doubles */
function dbSale(r){r.fy=fyOf(r.date);r.ch=chalByFolio(r.folio,r.fy);r.warn=[];r.info=[];r.dupT="";r.prevT="";r.prevDiff=[];r.fin=null;r.old=null;
  const C=[],seen={},add=(s,sc,how)=>{if(seen[s.no])return;seen[s.no]=1;C.push({s,sc,how})};
  if(r.ch&&r.ch.no){const s=V(D.vs).find(x=>x.no===r.ch.no&&x.open);if(s)add(s,nameSim(r.name,s.cust)>=.5?1:.55,`Challan ${r.ch.ch}`)}
  sales().forEach(s=>{const ns=nameSim(r.name,s.cust);if(ns<.55)return;const d=dbDd(r.date,s.date);if(d>20)return;
    add(s,ns*.6+(d<=1?.35:d<=5?.25:d<=10?.1:0)+(r.model&&nz(r.model).length>1&&nz(s.model).includes(nz(r.model).slice(0,3))?.05:0),"name + date")});
  r.cands=C.sort((a,b)=>b.sc-a.sc).slice(0,6);
  if(!r.manual){const c=r.cands[0];r.pick=c&&c.sc>=.55?c.s.no:"";r.sure=!!c&&c.sc>=.8&&(!r.cands[1]||c.sc-r.cands[1].sc>=.1)}
  const s=r.pick&&V(D.vs).find(x=>x.no===r.pick);r.s=s||null;
  if(r.ch&&r.ch.no&&s&&r.ch.no!==s.no)r.warn.push(`Challan ${r.ch.ch} is already linked to another sale: ${r.ch.no.replace(/^66115/,"")} · ${r.ch.name||""}`);
  if(r.ch&&!r.ch.no&&r.ch.name&&nameSim(r.ch.name,r.name)<.5)r.warn.push(`Challan ${r.ch.ch} : Excel name is "${r.ch.name}" `);
  if(s&&!r.ch&&chalOf(s.no)&&r.folio&&String(chalOf(s.no).ch)!==String(r.folio))r.warn.push(`This sale already has challan ${chalOf(s.no).ch} ; Day Book says ${r.folio}`);
  const d=D.dbk.find(x=>x.kind==="sale"&&dbEq(x.amt,r.amt)&&dbEq(x.online||0,r.online||0)&&dbEq(x.finAmt,r.finAmt)&&x.date===r.date&&(r.folio&&x.folio?String(x.folio)===String(r.folio):nameSim(x.name,r.name)>=.6));
  if(d)r.dupT=`Day Book already added: ${fd(d.date)} · ${d.folio?"Challan "+d.folio+" · ":""}${d.name} · ${rs(d.amt)} — no difference`;
  const prevs=D.dbk.filter(x=>x.kind==="sale"&&x!==d&&((r.folio&&x.folio&&String(x.folio)===String(r.folio)&&fyOf(x.date)===r.fy)||(r.pick&&x.no&&x.no===r.pick))).sort((a,b)=>(a.at||0)-(b.at||0));
  if(prevs.length&&!d){const p=prevs[prevs.length-1],df=[],cmp=(l,a,b)=>{if(!dbEq(a,b))df.push(`${l}: was ${rs(a)} → now ${rs(b)}`)};
    if(p.date!==r.date)df.push(`Date: was ${fd(p.date)} → now ${fd(r.date)}`);
    if(nameSim(p.name,r.name)<.6)df.push(`Name: was ${p.name} → now ${r.name}`);
    if(String(p.folio||"")!==String(r.folio||""))df.push(`Challan: was ${p.folio||"—"} → now ${r.folio||"—"}`);
    cmp("Cash",N(p.amt),N(r.amt));cmp("Account",N(p.online),N(r.online));
    if(!dbEq(p.finAmt,r.finAmt)||(p.co&&r.co&&nz(p.co)!==nz(r.co)))df.push(`Finance: was ${p.co||"—"} ${rs(N(p.finAmt))} → now ${r.co||"—"} ${rs(N(r.finAmt))}`);
    if(!dbEq(p.oldPrice,r.oldPrice)||nz(p.oldReg||"")!==nz(r.oldReg||""))df.push(`Old bike: was ${p.oldReg||"—"} ${rs(N(p.oldPrice))} → now ${r.oldReg||"—"} ${rs(N(r.oldPrice))}`);
    const pt=N(p.amt)+N(p.online)+N(p.finAmt)+N(p.oldPrice);if(!dbEq(pt,dbTot(r)))df.push(`Bike total: was ${rs(pt)} → now ${rs(dbTot(r))}`);
    r.prevT=`This bike is already saved in the Day Book — ${fd(p.date)}${p.folio?" · Challan "+p.folio:""} · ${p.name}${prevs.length>1?` (total ${prevs.length} times)`:""}`;r.prevDiff=df}
  const ex=r.ch||(s&&chalOf(s.no));
  if(r.online&&dbEq(r.online,r.amt))r.warn.push("Cash and Online have the same amount. Is it entered twice? Clear Online if not needed");
  if(ex&&((r.amt&&(dbEq(ex.cash,r.amt)||dbEq(ex.dp,r.amt)))||(r.online&&dbEq(ex.online,r.online))))r.info.push(`Excel has, on this challan, cash ${rs(ex.cash)} · online ${rs(ex.online)} `);
  V(D.rc).filter(x=>!/payment/i.test(x.tt)&&dbEq(x.amt,r.amt)&&dbDd(x.date,r.date)<=2&&nameSim(x.party,r.name)>=.55).forEach(x=>r.info.push(`DMS receipt ${x.no} also has ${rs(x.amt)} `));
  r.co=r.finCode?coNorm(r.finCode)||r.finCode:"";
  if(r.finAmt){const f=(s&&finOf(s.no))||(r.folio&&D.fin.find(x=>x.xl===r.fy+"-"+r.folio));r.fin=f||null;
    if(f){if(dbEq(f.amt,r.finAmt)&&(!r.co||nz(f.co)===nz(r.co)))r.info.push(`Finance file already ✔ ${f.co} ${rs(f.amt)}`);else r.warn.push(`Finance file has ${f.co} ${rs(f.amt)} ; Day Book has ${r.co} ${rs(r.finAmt)} (will not change)`)}}
  if(r.oldReg||r.oldPrice){const o=D.old.find(x=>(r.oldReg&&x.reg&&nz(x.reg)===nz(r.oldReg))||(r.folio&&x.ch&&String(x.ch)===String(r.folio)&&x.fy===r.fy));r.old=o||null;
    if(o)r.info.push(`Old bike already exists: ${o.reg||"—"}${o.price?" · "+rs(o.price):""}`)}}
function dbOldSale(r){r.fy=fyOf(r.date);r.warn=[];r.info=[];r.dupT="";r.cands=[];r.oldNew=null;
  const byCh=r.folio?D.old.find(x=>x.ch&&String(x.ch)===String(r.folio)&&x.fy===r.fy):null,byReg=r.oldReg?D.old.find(x=>x.reg&&nz(x.reg)===nz(r.oldReg)):null;
  r.old=byCh||byReg||null;if(!r.old&&r.folio)r.oldNew=DB.find(x=>x.kind==="sale"&&String(x.folio)===String(r.folio)&&(x.oldReg||x.oldPrice))||null;
  const o=r.old||(r.oldNew?{reg:r.oldNew.oldReg,price:r.oldNew.oldPrice}:null),sold=N(r.amt)+N(r.online);
  if(o){if(r.oldReg&&o.reg&&nz(o.reg)!==nz(r.oldReg))r.warn.push(`Vehicle no. differs: challan ${r.folio} bike is ${o.reg} , here ${r.oldReg} is written. Correct one of them`);
    if(o.price)r.info.push(`Bought ${rs(o.price)} · Sold ${rs(sold)} · ${sold-o.price>=0?"Profit":"Loss"} ${rs(Math.abs(sold-o.price))}`)}
  const d=D.dbk.find(x=>x.kind==="oldsale"&&dbEq(x.amt,r.amt)&&dbEq(x.online||0,r.online||0)&&(r.folio?String(x.folio)===String(r.folio):nz(x.oldReg)===nz(r.oldReg)));
  if(d)r.dupT=`Day Book already added: ${fd(d.date)} · Old bike ${d.oldReg||""} Sold ${rs(N(d.amt)+N(d.online))}`;
  else if(r.old&&r.old.status==="sold"){if(dbEq(r.old.soldAmt,sold))r.dupT=`Old bikes already has this bike as sold for ${rs(r.old.soldAmt)} `;else r.warn.push(`Old bikes already marks this bike as "Sold"${r.old.soldAmt?" ("+rs(r.old.soldAmt)+")":""} — save will write the new amount`)}}
function dbBuild(){
  DB.forEach(r=>{if(r.saved||r.removed)return;if(r.kind==="sale"){dbSale(r);if(!r.manualInc)r.inc=!r.dupT&&!r.prevT&&dbHas(r)}
    else if(r.kind==="oldsale"){dbOldSale(r);if(!r.manualInc)r.inc=!r.dupT&&dbHas(r)}
    else{r.type=r.kind==="expense"?"out":"in";if(r.kind==="income"&&!r.incType)r.incType=dbIncDetect(r.name+" "+r.det)||"other";r.c=dbCands(r);if(!r.manualPk||!r.c.some(c=>c.key===r.pk)){const c=r.c[0];r.pk=c.key;r.manualPk=false;if(!r.manualInc)r.inc=c.k!=="dup"&&c.k!=="skip"}}});
  DB.forEach((r,j)=>{if(r.saved||r.removed)return;const i=DB.findIndex((x,k)=>k<j&&x.kind===r.kind&&r.amt&&dbEq(x.amt,r.amt)&&x.date===r.date&&(r.kind==="sale"&&r.folio?String(x.folio)===String(r.folio):(nameSim(x.name,r.name)>=.6||nz(x.name)===nz(r.name))));
    if(i<0)return;const t=`Twice on this page (like line ${i+1} )`;
    if(!dbIsMoney(r)){r.dupT=t;if(!r.manualInc)r.inc=false}else{const c={k:"dup",sc:1,t,key:"dup|batch"};r.c.unshift(c);if(!r.manualPk){r.pk=c.key;if(!r.manualInc)r.inc=false}}})}

/* photo reading (Gemini via Firebase AI Logic, same setup as the register photo) */
async function aiJSON(prompt,data){await aiCheck();const AI=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-ai.js`);const ai=AI.getAI(FB.app,{backend:new AI.GoogleAIBackend()});let err=null;
  for(const m of AI_MODELS){try{const model=AI.getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:"application/json",temperature:0}});const r=await model.generateContent([prompt,{inlineData:{data,mimeType:"image/jpeg"}}]);
    return JSON.parse(r.response.text().replace(/^```(json)?|```$/g,"").trim())}catch(e){err=e;if(!/not.?found|404|unsupported|deprecat/i.test(String(e&&e.message)))break}}throw err}
const DB_PROMPT=`This is a photo of a handwritten Day Book (Rojnamcha) of a Hero two-wheeler dealership in India. It is mainly the vehicle sales register: each entry is usually one new vehicle sold, with a Folio number (= the dealer's challan number), customer name, model (SPL+ = Splendor Plus, SUP SPL+ = Super Splendor, HF Deluxe, HF All Black, Glamour, Passion, Xtreme, Destini, Pleasure ...), money received, finance, and sometimes an old (exchange) vehicle taken from the customer with its registration number (like HR02AU3234) and price. Some lines are other income (e.g. "Ins Renew" = insurance renewal) or money paid out, often written with a minus sign and subtracted in the running total.
HOW THIS DEALER WRITES THE BOOK — follow strictly:
1. Every amount in the Amount (₹) column is CASH received → "cash". If written as a calculation like 22000-4200, give the result.
2. Amounts written on the left inside the Particulars (विवरण) text are NOT cash:
   - with a finance company code next to it (BF/BFL = Bajaj Finance, SR/SFL = Shriram Finance, MCSL/Muthoot, IDFC, HDB, Chola, HFCL = Hero FinCorp) → the loan amount: "fin_code", "fin_amount";
   - otherwise it is money received online / in the bank (A/C, PNB, UPI, cheque, or no label). List EVERY such amount separately in "online_items" exactly as written (do not add them up), and put their sum in "online". Several lines under an entry like "18000 A/C", "2000 A/C", "20000 A/C", "20000 A/C" → online_items [18000,2000,20000,20000], online 60000.
   - "ACC", "Acc", "A/C", "AC" all mean the bank ACCOUNT (NOT accessories) → online. Example: "14800 ACC + 19000" with 19000 in the Amount column → online 14800, cash 19000.
   - A number in the Particulars that is the same as that entry's cash amount is the same money written twice: do NOT add it to online.
   - A calculation like "(22000-4200 EMI)" means the customer paid 22000 down payment and 4200 EMI was deducted, so 17800 was received: the 17800 is in the Amount column as cash; write "DP 22000 − EMI 4200" in note.
   - "old bike 25000" with a registration number → "old_reg", "old_price" (not online). Registration numbers look like HR02AV3234 (state, 2 digits, 1–2 letters, 4 digits) — read U and V carefully.
3. At the bottom of a page, under the total, lines like "PNB 48500", "PNB 37400" show cash deposited in the bank in the evening, and an amount drawn in a circle with a signature (it can be the page total itself, like a circled 133300, or a circled "Cash 19100") is the cash handed over to the owner Deepanshu in the evening. They are NOT entries — return them only in "deposits": bank lines with the bank name as "label", circled/signed cash with "label":"Deepanshu".
4. Each page has its own date at the top; ignore the printed words "Receipts" and "Payments". A line with its own date (like 30/6/26) uses that date.
5. A line saying an old bike was paid / sold, like "Ajay old bike paid 160 · 29000+5000 A/C · HR02AV3234 SPL+", means the dealer SOLD the old (exchange) vehicle that came with that folio: kind "oldsale", folio = that folio (160), old_reg = its registration, cash = the amount without A/C (29000), online_items [5000], online 5000. These amounts are usually not part of the page total.
6. Other income in this book is almost always an insurance RENEWAL ("Renew", "Renewal", "Ins Renew" — the handwriting can look like "Rent", but it is never rent) or a NUMBER PLATE ("No. Plate", "NP", "HSRP", "नंबर प्लेट"). For income lines set "income_type": "renewal", "numberplate" or "other", and do not write "Rent" in note.
7. "kind": "sale" (a vehicle customer's entry), "oldsale" (old vehicle sold, see 5), "income" (other money received) or "expense" (money paid out / subtracted). For income and expense lines use "cash" (Amount column) or "online" (written in Particulars with A/C / bank) the same way.
Return every entry with: page (1 = left page, 2 = right page), date (YYYY-MM-DD, or DD-MM if the year is not written), kind, folio (digits only, "" if none), name, model, cash, online, online_items, income_type, fin_code, fin_amount, old_reg, old_price, note (everything else: EMI, self, A/W, unclear words).
Also return "totals": the total of the Amount column written on each page, and "deposits".
Do not return total or running-total lines as entries. Skip lines struck through completely. Do not invent entries. Names in normal English spelling.
Return ONLY JSON: {"rows":[{"page":1,"date":"2026-07-01","kind":"sale","folio":"161","name":"Suman Lata","model":"HF Deluxe","cash":7000,"online":0,"online_items":[],"fin_code":"SFL","fin_amount":73229,"old_reg":"","old_price":0,"note":"D.P"}],"totals":[{"page":1,"amount":105000}],"deposits":[{"page":1,"label":"PNB","amount":48500},{"page":1,"label":"Deepanshu","amount":19100}]}`;
function dbRowFrom(x,pg){const kind=/old/i.test(x.kind)?"oldsale":/exp/i.test(x.kind)?"expense":/inc/i.test(x.kind)?"income":"sale";
  let cash=Math.abs(N(x.cash??x.amount)),items=(Array.isArray(x.online_items)?x.online_items:[]).map(v=>Math.abs(N(v))).filter(v=>v>0);if(N(x.acc))items.push(Math.abs(N(x.acc)));let online=items.length?items.reduce((a,b)=>a+b,0):Math.abs(N(x.online));if(!items.length&&online)items=[online];const base={pg,date:dbDate(x.date,""),kind,folio:String(x.folio||"").replace(/\D/g,""),name:String(x.name||"").trim(),model:String(x.model||"").trim(),inTotal:true,
    acc:0,finCode:String(x.fin_code||"").trim(),finAmt:N(x.fin_amount),oldReg:String(x.old_reg||"").toUpperCase().replace(/[\s-]/g,""),oldPrice:N(x.old_price),det:String(x.note||"").trim()};
  if(kind==="sale"||kind==="oldsale")return{...base,amt:cash,online,onlineItems:items,mode:"Cash"};
  const it=/plate|np/i.test(String(x.income_type||""))?"numberplate":/renew/i.test(String(x.income_type||""))?"renewal":dbIncDetect(base.name+" "+base.det)||(kind==="income"?"other":"");
  return{...base,amt:cash||online,online:0,mode:cash?"Cash":online?"Bank":"Cash",incType:it,det:it==="renewal"&&/^\s*rent\s*$/i.test(base.det)?"Renewal":base.det}}

const WS_PROMPT=`This is a photo or screenshot of a two-wheeler (Hero) workshop's daily cash sheet titled "DAY BOOK", with columns DATE, S.NO., JC NO., ONLINE, CASH, CREDIT, WORK.
Read it exactly and return JSON:
{"date":"YYYY-MM-DD",
 "jobs":[{"sno":1,"jc":"3229","online":50,"cash":250,"type":"GENERAL","work":"","note":""}],
 "counter":[{"desc":"MINI BULB","online":15,"cash":0}],
 "updates":[{"desc":"","online":0,"cash":150}],
 "total_online":11715,"total_cash":4425,
 "expenses":[{"desc":"GHEE","amount":230}],
 "net_cash":3795}
Rules:
- One job row per job card. "type" = the CREDIT column (FSC, AMC, GENERAL, ONLINE, CANCEL, PENDING …). "work" = WORK column. Empty amounts = 0.
- Text in the DATE column that is not a date (like JOYRIDE550(3)) goes in that row's "note".
- A row with a JC NO. but no S.NO. (an older job card) is still a job.
- Rows under COUNTER SALE are "counter"; rows under UPDATE are "updates" (description from the CREDIT/WORK column).
- The row that has only the ONLINE and CASH totals gives total_online and total_cash.
- Lines below it with an amount and a description are "expenses"; the line marked TOTAL is net_cash.
- Do not invent rows. Return ONLY JSON.`;
function wsFromAI(j){const T=x=>String(x??"").trim();return{date:dbDate(j.date,""),src:"Photo",
  jobs:(j.jobs||[]).map(x=>({sno:T(x.sno),jc:T(x.jc).replace(/\D/g,""),online:N(x.online),cash:N(x.cash),type:T(x.type).toUpperCase(),work:T(x.work),note:T(x.note)})).filter(x=>x.jc),
  counter:(j.counter||[]).map(x=>({desc:T(x.desc),online:N(x.online),cash:N(x.cash)})).filter(x=>x.online||x.cash),
  updates:(j.updates||[]).map(x=>({desc:T(x.desc),online:N(x.online),cash:N(x.cash)})).filter(x=>x.online||x.cash),

async function importFiles(files){
  if(typeof XLSX==="undefined")return alert("Excel reader not loaded — check internet and reload.");
  const log=$("log");log.innerHTML=`<div class="card">Reading ${files.length} file(s)…</div>`;const res=[],changed=new Set();
  for(const f of files){
    try{
      const sn=await readSnapshot(f);
      if(sn){if(!sn.rows.length){res.push(`<tr><td>${esc(f.name)}</td><td colspan="2" class="neg">Snapshot has no bills</td></tr>`);continue}
        let added=0,upd=0;for(const o of sn.rows){const k=sn.kind+"|"+o.no;if(D.snap[k])upd++;else added++;D.snap[k]=o}changed.add("snap");
        const ds=sn.rows.map(x=>x.date).filter(Boolean).sort();D.meta.snap={at:today(),from:fd(ds[0]),to:fd(ds[ds.length-1]),file:f.name};
        res.push(`<tr><td>${esc(f.name)}</td><td>${esc(sn.kind)} Snapshot${sn.dealer?` <span class="muted">· ${esc(sn.dealer)}</span>`:""}</td><td class="num">${added} new${upd?`, ${upd} updated`:""}</td></tr>`);continue}
      const rows=await readWorkbook(f),t=detect(rows);
      if(!t){res.push(`<tr><td>${esc(f.name)}</td><td colspan="2" class="neg">Not recognised</td></tr>`);continue}
      const agg=aggregate(t,rows);let added=0,upd=0;
      changed.add(t);if(t==="vp")Object.keys(D.vp).forEach(k=>{if(!k.includes("|"))delete D.vp[k]});if(t==="stock"){D.stock=agg;added=agg.length}else for(const[k,v]of Object.entries(agg)){if(D[t][k])upd++;else added++;D[t][k]=v}
      const ds=(t==="stock"||t==="acct")?[]:V(agg).map(x=>x.date).filter(Boolean).sort();
      D.meta[t]={at:today(),from:ds[0]?fd(ds[0]):"",to:ds.length?fd(ds[ds.length-1]):"",file:f.name};
      res.push(`<tr><td>${esc(f.name)}</td><td>${esc(REPORTS[t].name)}</td><td class="num">${added} new${upd?`, <span class="muted">${upd} already in app – updated, not doubled</span>`:""}</td></tr>`);
    }catch(e){res.push(`<tr><td>${esc(f.name)}</td><td colspan="2" class="neg">Error: ${esc(e.message)}</td></tr>`)}
  }
  save();imp();$("log").innerHTML=`<div class="card">⏳ Saving to cloud…</div>`;
  try{await pushDMS(changed)}catch(e){$("log").innerHTML=`<div class="card neg">Cloud save failed: ${esc(e.message||e)} — check internet and import again.</div>`;return}
  $("log").innerHTML=`<div class="tw"><table><tr><th>File</th><th>Detected as</th><th>Result</th></tr>${res.join("")}</table></div><p><button class="btn" onclick="go('dash')">Open dashboard →</button></p>`;
}

    /* App Check: Firebase may require it for the database (enforced), not only for Gemini — start it before any read */
    try{const AC=await import(b+"firebase-app-check.js");let k=RCK;try{k=localStorage.getItem("de_rck")||RCK}catch(e){}FB.ac=AC.initializeAppCheck(app,{provider:new AC.ReCaptchaEnterpriseProvider(k),isTokenAutoRefreshEnabled:true})}catch(e){console.warn("App Check start failed",e)}
  }catch(e){screen(`<h2 style="margin-top:0">No internet</h2><p>Internet is needed to open the app.</p><button class="btn" onclick="location.reload()">Try again</button>${noData()?"":` <button class="btn g" onclick="setSync('📴 Offline – old copy');nav();render()">See last saved copy</button>`}`);return}
  FB.U.onAuthStateChanged(FB.auth,u=>{if(u){ME=u.email||"";$("logoutBtn").style.display="";start()}else{$("logoutBtn").style.display="none";login()}});
}
function login(msg=""){
  setSync("");
  screen(`<h2 style="margin-top:0">Login – Deepanshu Enterprises</h2>${msg?`<p class="neg">${esc(msg)}</p>`:""}
  <form onsubmit="doLogin(event)"><label>Email</label><input id="l_e" type="email" autocomplete="username" autocapitalize="none" required>
  <label style="margin-top:10px">Password</label><input id="l_p" type="password" autocomplete="current-password" required>
  <p><button class="btn" id="l_b">Login</button></p></form><p class="muted">Project: ${esc(fbCfg().projectId)} · <a href="#" onclick="forgot();return false">Forgot password?</a></p>`);
}
const authMsg=er=>{const c=(er&&er.code)||"";return /invalid|wrong-password|user-not-found/.test(c)?"Wrong email or password.":/too-many/.test(c)?"Too many tries. Wait a little.":/network/.test(c)?"No internet.":"Login failed ("+(c||er)+")"};
async function doLogin(e){e.preventDefault();$("l_b").disabled=true;$("l_b").textContent="⏳";try{await FB.U.signInWithEmailAndPassword(FB.auth,$("l_e").value.trim(),$("l_p").value)}catch(er){login(authMsg(er))}}
async function forgot(){const em=$("l_e").value.trim();if(!em)return alert("First type your email above.");try{await FB.U.sendPasswordResetEmail(FB.auth,em);alert("Password reset link sent to "+em+" (check Spam too).")}catch(er){alert(authMsg(er))}}
async function logout(){UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];try{localStorage.removeItem(KEY)}catch(e){}try{await FB.U.signOut(FB.auth)}catch(e){}location.reload()}
const R_=(...p)=>FB.F.doc(FB.db,"shops",SHOP,...p),C_=c=>FB.F.collection(FB.db,"shops",SHOP,c);
async function start(){
  screen(`<div class="empty">⏳ Loading…</div>`);setSync("⏳");
  try{await FB.F.getDoc(R_("meta","info"))}catch(e){if(/permission-denied/.test(e&&e.code||""))return staffStart();}
  startOwner()}
function startOwner(){
  aiCloudLoad();
  screen(`<div class="empty">⏳ Loading data…</div>`);setSync("⏳");
  const {F}=FB;let ready={m:0,e:0,c:0,f:0,p:0,a:0,k:0,h:0,o:0,d:0};const go1=()=>{if(ready.m&&ready.e&&ready.c&&ready.f&&ready.p&&ready.a&&ready.k&&ready.h&&ready.o&&ready.d){BOOTED=true;setSync("☁ Synced · "+ME);save();nav();render()}};
  UNSUB.push(F.onSnapshot(R_("meta","info"),async snap=>{
    const m=snap.exists()?snap.data():null;
    if(!m){if(!ready.m){let cloud=false;try{const res=await loadDMS(null);cloud=res.any}catch(e){}ready.m=1;go1();if(!cloud&&!noData()){setSync("⏳ Uploading this device's data…");try{await pushDMS(DMSK);D.exp.forEach(e=>cPut("exp",e.id,e));Object.entries(D.coll).forEach(([no,v])=>cPut("coll",no,{...v,no}));setSync("☁ Synced · "+ME)}catch(e){cErr(e)}}}return}
    if(m.ver===VER&&ready.m)return;
    try{await loadDMS(m)}catch(e){return cErr(e)}
    VER=m.ver;PARTS=m.parts||{};D.meta=m.meta||{};
    if(!ready.m){ready.m=1;go1()}else{save();refresh()}
  },cErr));
  UNSUB.push(F.onSnapshot(C_("dupok"),snap=>{const o={};snap.docs.forEach(d=>{o[d.data().key]=1});D.dupok=o;if(!ready.k){ready.k=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("chal"),snap=>{const o={};snap.docs.forEach(d=>{const x=d.data();o[x.key]=x});D.chal=o;if(!ready.h){ready.h=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("emp"),snap=>{D.emp=snap.docs.map(d=>d.data());if(BOOTED)refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("att"),snap=>{const o={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.m)o[x.m]=x});D.att=o;if(BOOTED)refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("wsd"),snap=>{const o={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.date)o[x.date]=x});D.wsd=o;if(BOOTED)refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("dbk"),snap=>{D.dbk=snap.docs.map(d=>d.data());if(!ready.d){ready.d=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("old"),snap=>{D.old=snap.docs.map(d=>d.data());if(!ready.o){ready.o=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("areg"),snap=>{D.areg=snap.docs.map(d=>d.data());if(!ready.a){ready.a=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("fin"),snap=>{D.fin=snap.docs.map(d=>d.data());if(!ready.f){ready.f=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("finpay"),snap=>{D.finpay=snap.docs.map(d=>d.data());if(!ready.p){ready.p=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("exp"),snap=>{D.exp=snap.docs.map(d=>d.data());if(!ready.e){ready.e=1;go1()}else refresh()},cErr));
  UNSUB.push(F.onSnapshot(C_("coll"),snap=>{const o={};snap.docs.forEach(d=>{const x=d.data();o[x.no]=x});D.coll=o;if(!ready.c){ready.c=1;go1()}else refresh()},cErr));
}
async function loadDMS(m){
  /* reads every DMS chunk in the cloud; uses the version the index points to, and if the index is missing or broken,
     falls back to the newest complete copy that is actually stored — then repairs the index (no data is rewritten) */
  const snap=await FB.F.getDocs(C_("dms")),by={};let any=false;
  snap.docs.forEach(d=>{const x=d.data();if(!x||x.k==null)return;any=true;((by[x.k]=by[x.k]||{})[x.ver]=by[x.k][x.ver]||[])[x.i]=x.j});
  const fixP={},fixV={},cnt=o=>Array.isArray(o)?o.length:Object.keys(o||{}).length;
  for(const k of DMSK){const n=(m&&m.parts||{})[k]||0,cands=[m&&m.vers&&m.vers[k],m&&m.ver].filter(v=>v!=null);let got=null;
    for(const v of cands){const a=by[k]&&by[k][v];if(n&&a&&a.length>=n&&!a.slice(0,n).some(x=>x==null)){try{got=JSON.parse(a.slice(0,n).join(""))}catch(e){}if(got)break}}
    if(!got&&by[k]){for(const v of Object.keys(by[k]).sort((a,b)=>b-a)){const a=by[k][v];let c=0;while(a[c]!=null)c++;if(!c)continue;try{const o=JSON.parse(a.slice(0,c).join(""));if(cnt(o)||!n){got=o;fixP[k]=c;fixV[k]=+v;break}}catch(e){}}}
    if(!got&&n)throw new Error("Data still uploading – reload in a minute");D[k]=got||(k==="stock"?[]:{})}
  if(Object.keys(fixP).length){const nm={ver:(m&&m.ver)||Date.now(),meta:(m&&m.meta)||D.meta||{},...(m||{}),parts:{...((m&&m.parts)||{}),...fixP},vers:{...((m&&m.vers)||{}),...fixV},by:ME,fixed:Date.now()};
    try{await FB.F.setDoc(R_("meta","info"),nm);PARTS=nm.parts;console.warn("DMS index repaired",fixP)}catch(e){console.warn("index repair failed",e)}}
  return{any,fixed:Object.keys(fixP)}}
async function pushDMS(keys){
  const {F}=FB,ver=Date.now(),cm=await curMeta(),vers={...(cm.vers||{})},parts={...PARTS,...(cm.parts||{})},was={...parts};
  for(const k of keys){const j=JSON.stringify(D[k]),n=Math.max(1,Math.ceil(j.length/CH));
    for(let i=0;i<n;i++)await F.setDoc(R_("dms",k+"_"+i),{k,i,ver,j:j.slice(i*CH,(i+1)*CH)});
    for(let i=n;i<(was[k]||0);i++)await F.deleteDoc(R_("dms",k+"_"+i));
    parts[k]=n;vers[k]=ver}
  await F.setDoc(R_("meta","info"),{ver,parts,vers,meta:D.meta,by:ME,at:F.serverTimestamp()});
  VER=ver;PARTS=parts;
}
let CC={};
const dmsHave=k=>k==="stock"?D.stock.length:Object.keys(D[k]||{}).length;
async function cloudCheck(){const out=$("cc_out");out.innerHTML="⏳ Cloud checking…";
  try{const ms=await FB.F.getDoc(R_("meta","info")),m=ms.exists()?ms.data():null,snap=await FB.F.getDocs(C_("dms")),by={};
    snap.docs.forEach(d=>{const x=d.data();if(!x||x.k==null)return;((by[x.k]=by[x.k]||{})[x.ver]=by[x.k][x.ver]||[])[x.i]=x.j});
    CC={};const tm=v=>new Date(+v).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const rows=DMSK.map(k=>{const want=m&&m.parts?m.parts[k]||0:0,vs=Object.keys(by[k]||{}).sort((a,b)=>b-a);
      const info=vs.map(v=>{const a=by[k][v];let n=0;while(a[n]!=null)n++;let cnt=null;try{const o=JSON.parse(a.slice(0,n).join(""));cnt=Array.isArray(o)?o.length:Object.keys(o).length;if(cnt&&!CC[k])CC[k]={v:+v,o}}catch(e){}return`${tm(v)}: ${n} parts · ${cnt==null?"<span class='neg'>incomplete</span>":"<b>"+cnt+"</b> rows"}`});
      return[esc(REPORTS[k].name),{n:dmsHave(k)},want?`${want} parts · ${tm(m.vers&&m.vers[k]||m.ver)}`:`<span class="neg">No</span>`,info.join("<br>")||`<span class="neg">nothing</span>`]});
    const rec=Object.keys(CC).filter(k=>!dmsHave(k));
    out.innerHTML=`<p class="muted">Cloud index (meta/info): ${m?"present":"<b class='neg'>not found</b>"}</p>${table(["Report","App rows","Cloud index","Stored in cloud"],rows)}${rec.length?`<div class="note" style="margin-top:8px">Cloud has <b>${rec.map(k=>esc(REPORTS[k].name)).join(", ")}</b> data found that the app is not showing. <button class="btn s" onclick="cloudRecover()">↻ Bring this data back</button></div>`:`<p class="muted">Cloud has no data that the app is not already showing.</p>`}`}
  catch(e){out.innerHTML=`<span class="neg">Check failed: ${esc(e.message||e)}</span>`}}
async function cloudRecover(){const ks=Object.keys(CC).filter(k=>!dmsHave(k));if(!ks.length)return;
  if(!confirm("Cloud - bring back this data?\n"+ks.map(k=>"• "+REPORTS[k].name+" ("+(Array.isArray(CC[k].o)?CC[k].o.length:Object.keys(CC[k].o).length)+" rows)").join("\n")+"\n\n(nothing else will change)"))return;
  ks.forEach(k=>D[k]=CC[k].o);save();$("cc_out").innerHTML="⏳ Cloud saving…";try{await pushDMS(ks)}catch(e){return alert("Cloud save failed: "+(e.message||e))}
  alert("Data is back ✔");nav();go("dash")}
async function curMeta(){try{const s=await FB.F.getDoc(R_("meta","info"));return s.exists()?s.data():{}}catch(e){return{}}}
function cPut(c,id,obj){if(!FB)return;setSync("⏳ Saving…");FB.F.setDoc(R_(c,sid(id)),{...obj,by:obj.by||ME}).then(()=>setSync("☁ Synced · "+ME),cErr)}
function cDel(c,id){if(!FB)return;setSync("⏳ Saving…");FB.F.deleteDoc(R_(c,sid(id))).then(()=>setSync("☁ Synced · "+ME),cErr)}
function cErr(e){const c=(e&&e.code)||"";if(/permission-denied/.test(c)){UNSUB.forEach(u=>{try{u()}catch(x){}});UNSUB=[];screen(`<h2 style="margin-top:0">Access not given</h2><p><b>${esc(ME)}</b> cannot open this data yet. Add this email in Firebase → Firestore → Rules.</p>${rulesBox(ME,"")}<button class="btn" onclick="logout()">Logout</button>`);return}setSync("⚠ "+(c||e.message||e))}
let _rT=0;function refresh(){clearTimeout(_rT);_rT=setTimeout(refresh_,200)}
function refresh_(){if(dlg.open)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$("app").contains(a))return;nav();render()}
function saveColl(no){const v={no,date:$("m_d").value,amt:N($("m_a").value),mode:$("m_m").value};D.coll[no]=v;save();cPut("coll",no,v);dlg.close();nav();render()}
function undoColl(no){delete D.coll[no];save();cDel("coll",no);nav();render()}
function delExp(id){if(!confirm("Delete this entry?"))return;D.exp=D.exp.filter(e=>e.id!==id);save();cDel("exp",id);dlg.close();render()}
async function clearDMS(){if(!confirm("Delete all DMS data for everyone? Expense entries and marked receipts stay."))return;const k=D.exp,c=D.coll;D=EMPTY();D.exp=k;D.coll=c;save();await pushDMS(DMSK);imp()}
async function restoreAll(x){D=Object.assign(EMPTY(),x);save();screen(`<div class="empty">⏳ Uploading backup…</div>`);await pushDMS(DMSK);for(const e of D.exp)cPut("exp",e.id,e);for(const e of D.fin)cPut("fin",e.id,e);for(const e of D.areg)cPut("areg",e.id,e);for(const e of D.finpay)cPut("finpay",e.id,e);for(const e of D.old)cPut("old",e.id,e);for(const e of D.dbk)cPut("dbk",e.id,e);for(const e of D.emp||[])cPut("emp",e.id,e);for(const x of V(D.att||{}))cPut("att",x.m,x);for(const x of V(D.wsd||{}))cPut("wsd",x.date,x);for(const [k,v] of Object.entries(D.chal))cPut("chal",k,{...v,key:k});for(const [no,v] of Object.entries(D.coll))cPut("coll",no,{...v,no});nav();render()}

/* ---------- helpers ---------- */
function open(t,html){$("dlgT").textContent=t;$("dlgB").innerHTML=html;if(!dlg.open)dlg.showModal()}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function backup(){dl(new Blob([JSON.stringify(D)],{type:"application/json"}),`deepanshu-enterprises-backup-${today()}.json`)}
function restore(inp){const fl=inp.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.vs||!x.sv)throw 0;if(confirm("Replace all data (for everyone) with this backup?"))restoreAll(x)}catch(e){alert("Not a valid backup file")}};r.readAsText(fl);inp.value=""}
const dlg=$("dlg");
boot();
